<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countertop AI Display</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 2rem;
      color: #38bdf8;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    button:active {
      transform: scale(0.96);
    }
    #status {
      margin-top: 2rem;
      font-size: 1.25rem;
      color: #94a3b8;
    }
    #transcript {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-style: italic;
      color: #cbd5e1;
      max-width: 800px;
    }
    #response {
      margin-top: 1.5rem;
      font-size: 1.4rem;
      font-weight: 500;
      color: #f1f5f9;
      max-width: 800px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Countertop Voice Assistant</h1>
  <button id="listenBtn" onclick="toggleListening()">Tap to Start Voice Agent</button>
  <div id="status">Status: Idle</div>
  <div id="transcript"></div>
  <div id="response"></div>

  <script>
    // Insert your Gemini API key starting with "AQ." inside the double quotes below:
    const GEMINI_API_KEY = AQ.Ab8RN6Lp3BCncaSL8PBxJ2Y2PPH3afTYHGOtw5PHgIwYAhXqyw;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('status').innerText = 'Status: Listening... Speak into Jabra mic';
        document.getElementById('listenBtn').innerText = 'Listening...';
        document.getElementById('listenBtn').style.backgroundColor = '#ef4444';
      };

      recognition.onresult = async (event) => {
        const userPrompt = event.results[0][0].transcript;
        document.getElementById('transcript').innerText = `You: "${userPrompt}"`;
        document.getElementById('status').innerText = 'Status: Thinking...';
        await askGemini(userPrompt);
      };

      recognition.onerror = (event) => {
        document.getElementById('status').innerText = `Error: ${event.error}`;
        resetUI();
      };

      recognition.onend = () => {
        resetUI();
      };
    } else {
      document.getElementById('status').innerText = 'Speech recognition is not supported in this browser.';
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        document.getElementById('transcript').innerText = '';
        document.getElementById('response').innerText = '';
        recognition.start();
      }
    }

    function resetUI() {
      isListening = false;
      document.getElementById('status').innerText = 'Status: Idle';
      document.getElementById('listenBtn').innerText = 'Tap to Start Voice Agent';
      document.getElementById('listenBtn').style.backgroundColor = '#0284c7';
    }

    async function askGemini(prompt) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Keep response short (1-2 sentences) for spoken voice display: " + prompt }] }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          document.getElementById('response').innerText = `API Error: ${data.error.message}`;
          speakText(`Error: ${data.error.message}`);
          return;
        }

        const reply = data.candidates[0].content.parts[0].text;
        document.getElementById('response').innerText = reply;
        speakText(reply);

      } catch (err) {
        document.getElementById('response').innerText = `Request failed: ${err.message}`;
        speakText('Sorry, I encountered an error connecting to Gemini.');
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
